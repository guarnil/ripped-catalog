# Régénère le catalogue chaque jour et le publie s'il a changé.
#
# Les scripts de generator/Scripts interrogent TCGdex, Riftcodex, OPTCG API,
# Cardmarket et TCGCSV, puis publish_catalog.py met à jour les fichiers servis
# par GitHub Pages. L'app Ripped les télécharge d'elle-même.
#
# Garde-fous :
# - une source qui ne répond pas → rien n'est publié ce jour-là, le run échoue
#   (GitHub envoie un e-mail) et on réessaie le lendemain ;
# - publish_catalog.py refuse une liste qui perdrait une extension, ou une
#   extension qui perdrait une bonne part de ses cartes ;
# - une extension sans visuel de sachet, une rareté inconnue ou une extension
#   provisoire impossible à rattacher toute seule sont
#   publiée quand même, et un ticket « Catalogue : intervention nécessaire »
#   est ouvert.

name: Mise à jour du catalogue

on:
  schedule:
    # Quatre passages par jour. GitHub ne garantit pas l'heure d'une tâche
    # planifiée — elle part en retard quand ses machines sont chargées, et
    # peut être sautée. Répéter coûte deux minutes de machine et rattrape
    # l'exécution manquée ; publier deux fois la même chose ne change rien,
    # puisque rien n'est poussé sans changement.
    - cron: "17 5 * * *"    # 5 h 17 UTC
    - cron: "17 11 * * *"   # 11 h 17 UTC
    - cron: "17 17 * * *"   # 17 h 17 UTC
    - cron: "17 23 * * *"   # 23 h 17 UTC
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write
  issues: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer le catalogue
        run: |
          set -o pipefail
          mkdir -p generator/Ripped/Models generator/Ripped/Resources
          for script in generate_catalog generate_riftbound generate_onepiece generate_products; do
            echo "::group::$script"
            python3 "generator/Scripts/$script.py" 2>&1 | tee -a "$RUNNER_TEMP/generation.log"
            echo "::endgroup::"
          done

      - name: Vérifier que toutes les sources ont répondu
        run: |
          if grep -E "! (échec|cartes indisponibles|liste des produits)" "$RUNNER_TEMP/generation.log"; then
            echo "::error::Une source n'a pas répondu : rien n'est publié aujourd'hui."
            exit 1
          fi

      - name: Préparer les fichiers publiés
        run: |
          set -o pipefail
          python3 generator/Scripts/publish_catalog.py --site . 2>&1 | tee -a "$RUNNER_TEMP/generation.log"

      - name: Publier si quelque chose a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Catalogue mis à jour automatiquement"
            git push
          fi

      - name: Signaler ce qui demande une intervention
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch "$RUNNER_TEMP/generation.log"
          grep -E "! (sans visuel|rareté inconnue|extension provisoire)" "$RUNNER_TEMP/generation.log" > "$RUNNER_TEMP/attention.txt" || true
          [ -s "$RUNNER_TEMP/attention.txt" ] || exit 0

          title="Catalogue : intervention nécessaire"
          {
            echo "La mise à jour automatique a publié le catalogue. Ces points demandent une intervention — déposer un fichier dans ce dépôt, ou ajuster un script de \`generator/Scripts\` :"
            echo
            sed 's/^ *! /- /' "$RUNNER_TEMP/attention.txt"
            echo
            echo "Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$RUNNER_TEMP/body.md"

          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
            exit 0
          fi

          # La liste n'a pas bougé : on ne touche à rien, pour ne pas réveiller
          # le ticket à chaque passage.
          gh issue view "$existing" --json body --jq .body > "$RUNNER_TEMP/current.md"
          sed '$d' "$RUNNER_TEMP/current.md" | sed '/^Run : /d' > "$RUNNER_TEMP/current_points.md"
          sed '/^Run : /d' "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/new_points.md"
          if diff -q "$RUNNER_TEMP/current_points.md" "$RUNNER_TEMP/new_points.md" >/dev/null; then
            echo "Rien de nouveau à signaler."
            exit 0
          fi

          # Modifier le corps d'un ticket ne prévient personne : le commentaire,
          # lui, part en notification.
          gh issue edit "$existing" --body-file "$RUNNER_TEMP/body.md"
          {
            echo "La liste a changé :"
            echo
            sed 's/^ *! /- /' "$RUNNER_TEMP/attention.txt"
            echo
            echo "Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$existing" --body-file "$RUNNER_TEMP/comment.md"
